[paths]
environments_path = "./environments"
extensions_dirs = ["extensions/database"]

[build]
skip_base_generation = true
yaml_merger = "rust"
# Extension pool: pgrust is the default database (validated at Stage A2).
extensions = ["postgresql", "pgrust"]

[build.combos]
# ONE base combo = the functional base (app + database/pgrust).
entire = ["pgrust"]

[build.environments]
available = ["forwarding", "letsencrypt", "step-ca"]

[build.environments.forwarding]
extensions = []
combos = ["entire"]

[build.environments.letsencrypt]
extensions = []
combos = ["entire"]

[build.environments.step-ca]
extensions = []
combos = ["entire"]
