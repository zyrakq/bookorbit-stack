---
x-logging:
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"
services:
  bookorbit:
    container_name: bookorbit
    image: "${IMAGE:-ghcr.io/bookorbit/bookorbit:3.6.0}"
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
        compress: "${LOG_COMPRESS:-true}"
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "${PORT:-3000}"
      JWT_SECRET: "${JWT_SECRET:?}"
      SETUP_BOOTSTRAP_TOKEN: "${SETUP_BOOTSTRAP_TOKEN:?}"
      TZ: "${TZ:-UTC}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      DISABLE_LOCAL_AUTH: "${DISABLE_LOCAL_AUTH:-false}"
      APP_URL: "${APP_URL:-http://localhost:${BOOKORBIT_PORT:-3000}}"
      CLIENT_URL: "${CLIENT_URL:-${APP_URL:-http://localhost:${BOOKORBIT_PORT:-3000}}}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@bookorbit-db:5432/${POSTGRES_DB:?}}"
      POSTGRES_HOST: bookorbit-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: "${POSTGRES_DB:?}"
      OIDC_ALLOW_LOCAL_ISSUERS: "${OIDC_ALLOW_LOCAL_ISSUERS:-false}"
      READ_ALOUD_WORKER_URL: "http://bookorbit-readaloud:8787"
      READ_ALOUD_WORKER_TOKEN: "${READ_ALOUD_WORKER_TOKEN:-}"
      READ_ALOUD_MAX_OUTPUT_BYTES: "${READ_ALOUD_MAX_OUTPUT_BYTES:-21474836480}"
    volumes:
      - "bookorbit-books:/books"
      - "bookorbit-data:/data"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - "no-new-privileges:true"
    stop_grace_period: 30s
    networks:
      - bookorbit-network
    ports:
      - "${BOOKORBIT_PORT:-3000}:3000"
    depends_on:
      bookorbit-db:
        condition: service_healthy
  bookorbit-tts:
    container_name: bookorbit-tts
    image: "${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.0}"
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
        compress: "${LOG_COMPRESS:-true}"
    expose:
      - "8880"
    security_opt:
      - "no-new-privileges:true"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8880/v1/audio/voices')\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - bookorbit-network
  bookorbit-readaloud:
    container_name: bookorbit-readaloud
    image: "${READ_ALOUD_WORKER_IMAGE:-ghcr.io/bookorbit/bookorbit-read-aloud-worker:latest}"
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
        compress: "${LOG_COMPRESS:-true}"
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      READ_ALOUD_WORKER_TOKEN: "${READ_ALOUD_WORKER_TOKEN:-}"
      READ_ALOUD_LIBRARY_ROOTS: "${READ_ALOUD_LIBRARY_ROOTS:-/books}"
      READ_ALOUD_WORK_ROOT: /data/read-aloud/jobs
    depends_on:
      bookorbit:
        condition: service_healthy
    expose:
      - "8787"
    volumes:
      - "bookorbit-books:/books:ro"
      - type: volume
        source: bookorbit-data
        target: /data/read-aloud
        volume:
          subpath: read-aloud
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:8787/health',{headers:{authorization:'Bearer '+process.env.READ_ALOUD_WORKER_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)})\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - bookorbit-network
volumes:
  bookorbit-books:
    name: bookorbit-books
  bookorbit-data:
    name: bookorbit-data
networks:
  bookorbit-network:
    name: bookorbit-network